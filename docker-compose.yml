version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: iso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iso
      POSTGRES_PASSWORD: iso_dev_password
      POSTGRES_DB: iso
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iso -d iso"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
